[tools]
agy = "latest"
claude = "latest"
fd = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
gh = "latest"
herdr = "latest"
neovim = "latest"
node = "25.8.0"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
ripgrep = "latest"
uv = "latest"

[env]
_.file = { path = ".env", redact = true }

[settings.upgrade]
auto_prune = false
