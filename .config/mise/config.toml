[tools]
claude = "latest"
codex = "latest"
fd = "latest"
gh = "latest"
"github:herdrdev/herdr" = "latest"
neovim = "latest"
node = "25.8.0"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
"npm:agent-browser" = "0.43.0"
"npm:playwright" = "latest"
ripgrep = "latest"
uv = "latest"

[env]
_.file = { path = "~/.env", redact = true }
# Zed reads custom provider keys from <PROVIDER_NAME>_API_KEY
CLAUDE_VIA_AI_SERVER_API_KEY = { value = "{{ env.VPS_API_KEY }}", redact = true }
CODEX_VIA_AI_SERVER_API_KEY = { value = "{{ env.VPS_API_KEY }}", redact = true }
GEMINI_VIA_AI_SERVER_API_KEY = { value = "{{ env.VPS_API_KEY }}", redact = true }

[settings.upgrade]
auto_prune = false
