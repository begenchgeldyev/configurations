[tools]
agy = "latest"
claude = "latest"
fd = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
gh = "latest"
herdr = "latest"
neovim = "latest"
node = "25.8.0"
opencode = "latest"
ripgrep = "latest"
tmux = "latest"
uv = "latest"

[env]
# Resolves to ~/.env (template: .env.example); .config/opencode/opencode.json reads these via {env:...}.
_.file = { path = ".env", redact = true }

[settings.upgrade]
auto_prune = false
